[package]
name = "evus-mcp"
version = "2026.11.1"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
keyring = "4.2.0"
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", features = ["cookies", "form", "json"] }
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.3"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
totp-rs = { version = "6.0.0", features = ["otpauth"] }
zeroize = { version = "1.9.1", features = ["derive"] }
zip = "9.3.0"
